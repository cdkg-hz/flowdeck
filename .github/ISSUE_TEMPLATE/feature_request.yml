name: 功能建议
description: 描述你想解决的问题与使用场景。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁在什么情况下遇到什么困难？当前如何处理？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
      description: 描述希望实现的行为和如何判断它解决了问题。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息
      description: 可说明已有方案、部署约束、相关 Issue；请勿附上敏感信息。
